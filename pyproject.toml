[tool.poetry]
name = "les_etl_pipeline"
version = "0.1.0"
description = "Bronze/silver lakehouse ETL on GCP Dataproc Serverless"
authors = ["Francesco Gastaldello <gasta88@hotmail.com>"]
exclude = ["src/main*.py"]
packages = [
    { include = "src/**/*.py" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
google-cloud-storage = "^2.6.0"
delta-spark = "2.1.0"
Cerberus = "^1.3.4"
google-cloud-bigquery = "^3.5.0"
unidecode = "^1.3.6"
pandas = "^2.0.3"
lxml = ">=4.9,<6"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.24.0"
pyarrow = "^12.0.1"
pytest = "^7.4.0"
ruff = "^0.6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that need a local Spark/Delta runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the gate meaningful but low-noise for a codebase with wildcard imports.
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
